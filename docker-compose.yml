# Docker Compose topology for self-hosted deployment (ARCHITECTURE.md §5):
# six containers (web, api, worker, mongo, redis, reverse proxy) with the
# network posture and healthchecks §5 treats as non-negotiable.
#
# For local development, `docker-compose.dev.yml` publishes Mongo and Redis
# to localhost so apps/api and apps/worker can run on the host under `tsx`
# with a fast edit/restart loop:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mongo redis
#
# That override is dev-only and must never be applied in production — SEC-4
# audits exactly this.
name: ai-financial-os

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # No `ports:` — reachable only from other containers on the internal
    # network, never from the host's public interface (ARCHITECTURE.md §5).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Same network posture as mongo — internal only, no published ports.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever .env holds. .env carries host-facing values so
      # the same file works when api/worker run on the host during
      # development; inside the compose network these must be the service
      # names instead.
      MONGO_URI: mongodb://mongo:27017/ai-financial-os
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # wget, not curl -- node:22-alpine ships busybox wget, not curl.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # See the api service above — service names inside the network,
      # host-facing values in .env.
      MONGO_URI: mongodb://mongo:27017/ai-financial-os
      REDIS_URL: redis://redis:6379
      # Ollama runs natively on the host, not as a compose service
      # (ADR-0026 — local LLM inference wants direct GPU/unified-memory
      # access a Linux container on macOS can't give it). .env's
      # OLLAMA_HOST defaults to localhost:11434 for host-side `tsx` dev;
      # inside this network "localhost" would mean the container itself,
      # so it's overridden the same way MONGO_URI/REDIS_URL are above.
      OLLAMA_HOST: http://host.docker.internal:11434
    # host.docker.internal only resolves on Docker Desktop (mac/Windows)
    # without this; harmless there, required for Linux-host portability
    # (Docker Desktop ignores it since it already provides the mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # A queue processor has no HTTP surface to probe, so this only
      # confirms the process is still up -- it won't catch a worker that's
      # alive but wedged. A real liveness signal (last-completed-job
      # timestamp in Redis) is worth adding alongside ING-8's scheduled
      # poll, which gives a predictable heartbeat to check against.
      test: ["CMD-SHELL", "pgrep -f 'src/index.ts' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    healthcheck:
      # Stub until there's a real static build to serve — see apps/web/Dockerfile.
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    networks:
      - internal
    # The only container with a host-published port (ARCHITECTURE.md §5).

networks:
  internal:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
